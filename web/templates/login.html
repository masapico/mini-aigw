{{template "base" .}}

{{define "title"}}ログイン - mini-aigw{{end}}

{{define "content"}}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
  <div class="col-12 col-sm-10 col-md-6 col-lg-5 col-xl-4">
    <div class="modern-card p-4 p-sm-5">
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="5" cy="12" r="2.5" fill="currentColor" stroke="none" />
            <circle cx="19" cy="6" r="2" fill="currentColor" stroke="none" />
            <circle cx="19" cy="18" r="2" fill="currentColor" stroke="none" />
            <path d="M7.5 12h3c2 0 3.5-5 5.5-6h2" />
            <path d="M7.5 12h3c2 0 3.5 5 5.5 6h2" />
          </svg>
        </div>
        <h1 class="h4 fw-bold mb-1 text-dark">mini-aigw ログイン</h1>
        <p class="text-secondary small mb-0">AI Gateway 管理ポータルへサインイン</p>
      </div>

      {{if .Error}}
      <div class="alert alert-danger py-2 px-3 small mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-1"></i>
        <span>{{.Error}}</span>
      </div>
      {{end}}

      {{if .OIDCEnabled}}
      <div class="mb-4">
        <a href="{{basePath}}/auth/oidc/login" class="btn-modern-primary w-100 justify-content-center text-decoration-none py-2 mb-2">
          <i class="bi bi-shield-lock-fill me-1"></i> mini-id でログイン (SSO)
        </a>
        <div class="d-flex align-items-center my-3">
          <hr class="flex-grow-1 my-0 text-secondary">
          <span class="px-3 text-secondary small">またはローカルアカウント</span>
          <hr class="flex-grow-1 my-0 text-secondary">
        </div>
      </div>
      {{end}}

      <form method="POST" action="{{basePath}}/login">
        <div class="mb-3">
          <label for="username" class="dads-form-label">
            ユーザー名 <span class="dads-badge-required">必須</span>
          </label>
          <input
            type="text"
            class="form-control form-control-modern"
            id="username"
            name="username"
            required
            placeholder="例: admin"
            autofocus
          >
        </div>

        <div class="mb-4">
          <label for="password" class="dads-form-label">
            パスワード <span class="dads-badge-required">必須</span>
          </label>
          <input
            type="password"
            class="form-control form-control-modern"
            id="password"
            name="password"
            required
            placeholder="••••••••"
          >
        </div>

        <button type="submit" class="btn-modern-primary w-100 justify-content-center py-2">
          ログイン
        </button>
      </form>

    </div>
  </div>
</div>
{{end}}

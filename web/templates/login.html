{{template "base" .}}

{{define "title"}}ログイン - {{projectName}}{{end}}

{{define "content"}}
<div class="w-100" style="max-width: 400px;">
  <div>
    <div class="app-card p-4 p-sm-5">
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 44px; height: 44px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="5" cy="12" r="2.5" fill="currentColor" stroke="none" />
            <circle cx="19" cy="6" r="2" fill="currentColor" stroke="none" />
            <circle cx="19" cy="18" r="2" fill="currentColor" stroke="none" />
            <path d="M7.5 12h3c2 0 3.5-5 5.5-6h2" />
            <path d="M7.5 12h3c2 0 3.5 5 5.5 6h2" />
          </svg>
        </div>
        <h1 class="fs-4 fw-bold mb-1">{{projectName}} ログイン</h1>
        <p class="text-muted small mb-0">AI Gateway 管理ポータルへサインイン</p>
      </div>

      {{if .Error}}
      <div class="alert alert-danger py-2 px-3 small mb-4" role="alert">
        {{.Error}}
      </div>
      {{end}}

      {{if .OIDCEnabled}}
      <div class="mb-4">
        <a href="{{basePath}}/auth/oidc/login" class="btn btn-primary w-100 mb-2">
          <i class="bi bi-shield-lock"></i> mini-id でログイン (SSO)
        </a>
        <div class="d-flex align-items-center my-3">
          <hr class="flex-grow-1 my-0 text-secondary">
          <span class="px-3 text-secondary small">またはローカルアカウント</span>
          <hr class="flex-grow-1 my-0 text-secondary">
        </div>
      </div>
      {{end}}

      <form method="POST" action="{{basePath}}/login">
        <div class="mb-3">
          <label for="username" class="form-label">ユーザー名</label>
          <input
            type="text"
            class="form-control form-control"
            id="username"
            name="username"
            required
            autofocus
            autocomplete="username"
          >
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">パスワード</label>
          <input
            type="password"
            class="form-control form-control"
            id="password"
            name="password"
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn btn-primary w-100">
          ログイン
        </button>
      </form>

    </div>
  </div>
</div>
{{end}}

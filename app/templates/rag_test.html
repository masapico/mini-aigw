{% extends "base.html" %}

{% block title %}RAG テスト - mini-aigw{% endblock %}

{% block content %}
<div class="mb-4 d-flex justify-content-between align-items-center">
  <div>
    <h3 class="fw-bold mb-1">RAG 動作検証・テスト</h3>
    <p class="text-muted small mb-0">
      S3 Vectors プリフィルタリング（権限分離）と Bedrock Converse API 引用元連携のリアルタイム確認
    </p>
  </div>
  <span class="badge-pill-modern badge-group font-monospace">KB ID: {{ kb_id }}</span>
</div>

<!-- タブ切り替え -->
<ul class="nav nav-pills mb-4 gap-2" id="ragTabs" role="tablist">
  <li class="nav-item" role="presentation">
    <button
      class="nav-link active rounded-pill px-4 fw-semibold"
      id="retrieve-tab"
      data-bs-toggle="pill"
      data-bs-target="#retrieve-panel"
      type="button"
      role="tab"
    >
      ナレッジ検索単体 (Retrieve)
    </button>
  </li>
  <li class="nav-item" role="presentation">
    <button
      class="nav-link rounded-pill px-4 fw-semibold"
      id="chat-tab"
      data-bs-toggle="pill"
      data-bs-target="#chat-panel"
      type="button"
      role="tab"
    >
      対話シミュレーション (Converse + RAG)
    </button>
  </li>
</ul>

<div class="tab-content" id="ragTabsContent">
  <!-- 1. Retrieve 単体タブ -->
  <div class="tab-pane fade show active" id="retrieve-panel" role="tabpanel">
    <div class="modern-card">
      <h5 class="fw-bold mb-3">Retrieve 単体テスト</h5>
      <form
        hx-post="/rag-test/retrieve"
        hx-target="#retrieve-results-box"
        hx-indicator="#retrieve-spinner"
      >
        <div class="row g-3">
          <div class="col-12 col-md-4">
            <label class="form-label small fw-semibold text-secondary">対象グループ (Pre-filtering)</label>
            <select class="form-select form-select-modern" name="group">
              {% for grp in groups %}
              <option value="{{ grp }}" {% if grp == 'public' %}selected{% endif %}>{{ grp }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-12 col-md-8">
            <label class="form-label small fw-semibold text-secondary">検索クエリ</label>
            <div class="d-flex gap-2">
              <input
                type="text"
                class="form-control form-control-modern"
                name="query"
                placeholder="ナレッジベースを検索..."
                required
              >
              <button type="submit" class="btn-modern-primary text-nowrap px-4">
                <span class="spinner-border spinner-border-sm htmx-indicator" id="retrieve-spinner" role="status"></span>
                検索
              </button>
            </div>
          </div>
        </div>
      </form>

      <div id="retrieve-results-box">
        <!-- HTMX パーシャル描画先 -->
      </div>
    </div>
  </div>

  <!-- 2. Converse + RAG 対話タブ -->
  <div class="tab-pane fade" id="chat-panel" role="tabpanel">
    <div class="modern-card">
      <h5 class="fw-bold mb-3">対話テスト (Citations 引用付き)</h5>
      <form
        hx-post="/rag-test/chat"
        hx-target="#chat-results-box"
        hx-indicator="#chat-spinner"
      >
        <div class="row g-3 mb-3">
          <div class="col-12 col-md-6">
            <label class="form-label small fw-semibold text-secondary">LLM モデル</label>
            <select class="form-select form-select-modern font-monospace small" name="model_id">
              {% for m in models %}
              <option value="{{ m }}">{{ m }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label small fw-semibold text-secondary">所属グループ (アクセス可能ナレッジ)</label>
            <select class="form-select form-select-modern" name="group">
              {% for grp in groups %}
              <option value="{{ grp }}" {% if grp == 'public' %}selected{% endif %}>{{ grp }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold text-secondary">質問内容</label>
          <div class="d-flex gap-2">
            <textarea
              class="form-control form-control-modern"
              name="query"
              rows="2"
              placeholder="質問を入力してください（ナレッジを検索して引用付きで回答します）"
              required
            ></textarea>
            <button type="submit" class="btn-modern-primary text-nowrap align-self-end px-4 py-2">
              <span class="spinner-border spinner-border-sm htmx-indicator" id="chat-spinner" role="status"></span>
              送信
            </button>
          </div>
        </div>
      </form>

      <div id="chat-results-box">
        <!-- HTMX パーシャル描画先 -->
      </div>
    </div>
  </div>
</div>
{% endblock %}

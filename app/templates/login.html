{% extends "base.html" %}

{% block title %}ログイン - mini-aigw{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
  <div class="col-12 col-sm-10 col-md-6 col-lg-4">
    <div class="modern-card p-4 p-sm-5">
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="5" cy="12" r="2.5" fill="currentColor" stroke="none" />
            <circle cx="19" cy="6" r="2" fill="currentColor" stroke="none" />
            <circle cx="19" cy="18" r="2" fill="currentColor" stroke="none" />
            <path d="M7.5 12h3c2 0 3.5-5 5.5-6h2" />
            <path d="M7.5 12h3c2 0 3.5 5 5.5 6h2" />
          </svg>
        </div>
        <h4 class="fw-bold mb-1">mini-aigw ログイン</h4>
        <p class="text-muted small">AI Gateway 管理ポータルへサインイン</p>
      </div>

      {% if error %}
      <div class="alert alert-danger py-2 px-3 small border-0 rounded-3 mb-4" role="alert">
        {{ error }}
      </div>
      {% endif %}

      {% if oidc_enabled %}
      <div class="mb-4">
        <a href="/auth/oidc/login" class="btn-modern-primary w-100 justify-content-center text-decoration-none py-2 mb-2">
          <span>🔑</span> mini-id でログイン (SSO)
        </a>
        <div class="d-flex align-items-center my-3">
          <hr class="flex-grow-1 my-0 text-muted">
          <span class="px-3 text-muted small">または</span>
          <hr class="flex-grow-1 my-0 text-muted">
        </div>
      </div>
      {% endif %}

      <form method="POST" action="/login">
        <div class="mb-3">
          <label for="username" class="form-label small fw-semibold text-secondary">ユーザー名</label>
          <input
            type="text"
            class="form-control form-control-modern"
            id="username"
            name="username"
            required
            placeholder="admin"
            autofocus
          >
        </div>

        <div class="mb-4">
          <label for="password" class="form-label small fw-semibold text-secondary">パスワード</label>
          <input
            type="password"
            class="form-control form-control-modern"
            id="password"
            name="password"
            required
            placeholder="••••••••"
          >
        </div>

        <button type="submit" class="btn-modern-primary w-100 justify-content-center py-2">
          ログイン
        </button>
      </form>

      <div class="mt-4 pt-2 text-center text-muted" style="font-size: 0.8rem;">
        初期アカウント: <code>admin</code> / <code>admin123</code>
      </div>
    </div>
  </div>
</div>
{% endblock %}

# mini-aigw Nginx サブパス配下リバースプロキシ設定例
#
# 【設定概要】
# 既存の Web サイト (例: https://sample.com/) のサブパス (/aigw/) 配下に
# mini-aigw (http://127.0.0.1:8000) をリバースプロキシします。
#
# 【mini-aigw 側の .env 設定】
# BASE_PATH=/aigw
# または
# PUBLIC_BASE_URL=https://sample.com/aigw
#
# ※ mini-aigw はデュアルマウントに対応しており、Nginx がプレフィックスを維持しても
#    除去してもどちらでも正しく動作します。

upstream mini_aigw_subpath_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name sample.com;

    # SSL 証明書設定 (環境に合わせて指定)
    # ssl_certificate     /etc/pki/tls/certs/sample.com.crt;
    # ssl_certificate_key /etc/pki/tls/private/sample.com.key;

    # 添付ファイルアップロード上限 (PDF/Office文書/画像添付対応)
    client_max_body_size 50M;

    # 末尾スラッシュなし (/aigw) でアクセスされた場合を /aigw/ へリダイレクト
    location = /aigw {
        return 301 $scheme://$http_host/aigw/;
    }

    # mini-aigw サブパスプロキシ
    location /aigw/ {
        # 推奨構成: プレフィックスを維持してそのままバックエンドに渡します
        proxy_pass http://mini_aigw_subpath_backend;

        # 代替構成: プレフィックスを除去して渡す場合 (こちらも mini-aigw で動作します)
        # proxy_pass http://mini_aigw_subpath_backend/;
        # proxy_redirect / /aigw/;

        # プロキシ・クライアント識別ヘッダー転送
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /aigw;

        # HTTP/1.1 と Keep-Alive 接続維持
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # SSE (Server-Sent Events) ストリーミング対応
        # AI 推論レスポンスのリアルタイム逐次表示のためにバッファリングを無効化
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # 長時間推論・ファイル抽出処理対応のタイムアウト設定 (秒)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # リダイレクト Location ヘッダーの自動補正
        proxy_redirect default;
    }

    # (参考) その他のメインアプリケーション等の設定
    # location / {
    #     root /var/www/html;
    #     index index.html;
    # }
}


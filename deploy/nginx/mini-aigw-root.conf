# mini-aigw Nginx ルートパス/専用仮想ホスト リバースプロキシ設定例
#
# 【設定概要】
# 専用のドメイン (例: https://aigw.sample.com/) のルートパス (/) 配下に
# mini-aigw (http://127.0.0.1:8000) をリバースプロキシします。
#
# 【mini-aigw 側の .env 設定】
# BASE_PATH=/ (または未指定)
# PUBLIC_BASE_URL=https://aigw.sample.com

upstream mini_aigw_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name aigw.sample.com;

    # SSL 証明書設定 (環境に合わせて指定)
    # ssl_certificate     /etc/pki/tls/certs/aigw.sample.com.crt;
    # ssl_certificate_key /etc/pki/tls/private/aigw.sample.com.key;

    # 添付ファイルアップロード上限 (PDF/Office文書/画像添付対応)
    client_max_body_size 50M;

    location / {
        proxy_pass http://mini_aigw_backend;

        # プロキシ・クライアント識別ヘッダー転送
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # HTTP/1.1 と Keep-Alive 接続維持
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # SSE (Server-Sent Events) ストリーミング対応
        # AI 推論レスポンスのリアルタイム逐次表示のためにバッファリングを無効化
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # 長時間推論・ファイル抽出処理対応のタイムアウト設定 (秒)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}


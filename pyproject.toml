[project]
name = "mini-aigw"
version = "0.1.0"
description = "AI Gateway for Amazon Bedrock and Bedrock Knowledge Bases with OpenAI compatibility"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "markitdown>=0.1.8",
    "authlib>=1.3.1",
    "argon2-cffi>=23.1.0",
    "boto3>=1.35.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "openai>=1.40.0",
    "pytest-mock>=3.14.0",
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
